name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    # ubuntu-latest is deliberate: this workflow renders ONLY for the
    # public_active tier (public repos), where hosted minutes are free.
    # Private repos get the self-hosted pool via the runner_labels token
    # in the test-*/release-* templates — see the Runner rule in the
    # wiki page (operations/new-github-repo-setup).
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@ed4bc48ec97379be2258e7b7ac2624a3e26ab809 # v7
        with:
          # Pin draft target to main; without this, PR-triggered runs send
          # target_commitish=refs/pull/N/merge which GitHub rejects.
          commitish: refs/heads/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
