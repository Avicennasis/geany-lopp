name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.cc }})
    # ubuntu-latest is deliberate: public repo, hosted minutes are free.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # geany ships geany.pc; geany-common ships the plugin headers.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends geany geany-common libgtk-3-dev pkg-config

      - name: Build plugin and tests
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -g -Werror"

      - name: Run tests
        run: make test CC=${{ matrix.cc }}

  sanitizers:
    name: Tests under ASan/UBSan
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends geany geany-common libgtk-3-dev pkg-config

      - name: Run tests with sanitizers
        run: make asan
